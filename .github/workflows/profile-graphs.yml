name: Profile live graphs

# Regenerates the animated contribution snake and the 3D contribution chart
# every day and publishes them to the `output` branch used by README.md.
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-graphs.yml"]

permissions:
  contents: write

concurrency:
  group: profile-graphs
  cancel-in-progress: true

jobs:
  graphs:
    runs-on: ubuntu-latest
    steps:
      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#2e1f6b,#4c34b8,#7c5cff,#22d3ee

      - name: 3D contribution chart
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect graphs
        # dist/ is created by the snake container as root, so gather into a fresh folder
        run: |
          mkdir -p site/3d
          cp dist/*.svg site/
          cp profile-3d-contrib/*.svg site/3d/
          ls -R site

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: site
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
