<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="MyPanditG — Offline panchang, kundali, matching &amp; puja vidhi">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b3b"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#facc15"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f97316"><animate attributeName="stop-color" values="#f97316;#facc15;#f97316" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#facc15"><animate attributeName="stop-color" values="#facc15;#f97316;#facc15" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#f97316" stop-opacity=".45"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#facc15" stop-opacity="0"/><stop offset="1" stop-color="#facc15" stop-opacity=".55"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="560" height="280" rx="18"/></clipPath>
  <style>
    .in   { animation: in .9s ease-out backwards; }
    @keyframes in { from { opacity:0; transform: translateY(10px); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity:.55; transform: scale(.9); } 50% { opacity:1; transform: scale(1.12); } }
    .spin { animation: spin 3s linear infinite; transform-origin: 462px 128px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip { animation: blip 2.7s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blip { 0% { opacity:0; transform: scale(.4); } 15% { opacity:1; transform: scale(1.4); } 100% { opacity:0; } }
    .ripple { animation: ripple 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ripple { from { transform: scale(1); opacity:.9; } to { transform: scale(4.2); opacity:0; } }
    .grow { animation: grow 2.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    @keyframes grow { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
    .draw { animation: draw 4s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 600; } 60%,100% { stroke-dashoffset: 0; } }
    .fan { animation: fan 3.2s ease-in-out infinite alternate; transform-origin: 462px 198px; }
    @keyframes fan { from { transform: rotate(0deg); } to { transform: rotate(var(--a)); } }
    .bob { animation: bob 2.2s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .float { animation: float 3.6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px); opacity:.7; } }
    .speed { animation: speed .9s linear infinite; }
    @keyframes speed { from { transform: translateY(-30px); opacity:0; } 50% { opacity:1; } to { transform: translateY(40px); opacity:0; } }
    .rise { animation: rise 2.8s ease-in infinite; }
    @keyframes rise { from { transform: translateY(0); opacity:0; } 20% { opacity:1; } to { transform: translateY(-140px); opacity:0; } }
    .hammer { animation: hammer 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; }
    @keyframes hammer { 0%,100% { transform: rotate(0); } 40% { transform: rotate(-35deg); } }
    .dust { animation: dust 2.6s ease-in infinite; }
    @keyframes dust { 0%,30% { transform: translate(0,0); opacity:1; } 100% { transform: translate(-60px,-50px) rotate(90deg); opacity:0; } }
    .brush { animation: brush 1.3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top; }
    @keyframes brush { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
    .type { animation: type 3.5s ease-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes type { 0% { transform: scaleX(0); } 25%,100% { transform: scaleX(1); } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(280px); } }
    .live { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity:.25; } }
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="560" height="280" fill="url(#bg)"/>
  <circle cx="462" cy="128" r="150" fill="url(#glow)"/>
  <g><g><animateTransform attributeName="transform" type="rotate" from="0 462 128" to="360 462 128" dur="12s" repeatCount="indefinite"/><circle cx="492.0" cy="128.0" r="4" fill="#facc15" opacity=".8"/><circle cx="483.2" cy="149.2" r="4" fill="#f97316" opacity=".8"/><circle cx="462.0" cy="158.0" r="4" fill="#facc15" opacity=".8"/><circle cx="440.8" cy="149.2" r="4" fill="#f97316" opacity=".8"/><circle cx="432.0" cy="128.0" r="4" fill="#facc15" opacity=".8"/><circle cx="440.8" cy="106.8" r="4" fill="#f97316" opacity=".8"/><circle cx="462.0" cy="98.0" r="4" fill="#facc15" opacity=".8"/><circle cx="483.2" cy="106.8" r="4" fill="#f97316" opacity=".8"/></g><g><animateTransform attributeName="transform" type="rotate" from="0 462 128" to="-360 462 128" dur="18s" repeatCount="indefinite"/><circle cx="517.0" cy="128.0" r="5" fill="#facc15" opacity=".8"/><circle cx="509.6" cy="155.5" r="5" fill="#f97316" opacity=".8"/><circle cx="489.5" cy="175.6" r="5" fill="#facc15" opacity=".8"/><circle cx="462.0" cy="183.0" r="5" fill="#f97316" opacity=".8"/><circle cx="434.5" cy="175.6" r="5" fill="#facc15" opacity=".8"/><circle cx="414.4" cy="155.5" r="5" fill="#f97316" opacity=".8"/><circle cx="407.0" cy="128.0" r="5" fill="#facc15" opacity=".8"/><circle cx="414.4" cy="100.5" r="5" fill="#f97316" opacity=".8"/><circle cx="434.5" cy="80.4" r="5" fill="#facc15" opacity=".8"/><circle cx="462.0" cy="73.0" r="5" fill="#f97316" opacity=".8"/><circle cx="489.5" cy="80.4" r="5" fill="#facc15" opacity=".8"/><circle cx="509.6" cy="100.5" r="5" fill="#f97316" opacity=".8"/></g><g><animateTransform attributeName="transform" type="rotate" from="0 462 128" to="360 462 128" dur="26s" repeatCount="indefinite"/><circle cx="542.0" cy="128.0" r="6" fill="#facc15" opacity=".8"/><circle cx="535.9" cy="158.6" r="6" fill="#f97316" opacity=".8"/><circle cx="518.6" cy="184.6" r="6" fill="#facc15" opacity=".8"/><circle cx="492.6" cy="201.9" r="6" fill="#f97316" opacity=".8"/><circle cx="462.0" cy="208.0" r="6" fill="#facc15" opacity=".8"/><circle cx="431.4" cy="201.9" r="6" fill="#f97316" opacity=".8"/><circle cx="405.4" cy="184.6" r="6" fill="#facc15" opacity=".8"/><circle cx="388.1" cy="158.6" r="6" fill="#f97316" opacity=".8"/><circle cx="382.0" cy="128.0" r="6" fill="#facc15" opacity=".8"/><circle cx="388.1" cy="97.4" r="6" fill="#f97316" opacity=".8"/><circle cx="405.4" cy="71.4" r="6" fill="#facc15" opacity=".8"/><circle cx="431.4" cy="54.1" r="6" fill="#f97316" opacity=".8"/><circle cx="462.0" cy="48.0" r="6" fill="#facc15" opacity=".8"/><circle cx="492.6" cy="54.1" r="6" fill="#f97316" opacity=".8"/><circle cx="518.6" cy="71.4" r="6" fill="#facc15" opacity=".8"/><circle cx="535.9" cy="97.4" r="6" fill="#f97316" opacity=".8"/></g><text x="462" y="138" text-anchor="middle" font-size="28">🕉️</text></g>
  <rect class="scan" x="0" y="0" width="560" height="80" fill="url(#scan)"/>
  <g class="in">
    <rect x="28" y="28" width="136" height="22" rx="11" fill="#f97316" fill-opacity=".18" stroke="#f97316" stroke-opacity=".7"/>
    <circle cx="40" cy="39" r="4" fill="#f97316" class="live"/>
    <text x="50" y="43" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="700" fill="#f97316" letter-spacing=".5">IN DEVELOPMENT</text>
  </g>
  <g class="in" style="animation-delay:.2s">
    <text x="28" y="105" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff">🕉️ MyPanditG</text>
  </g>
  <g class="in" style="animation-delay:.4s"><text x="28" y="150" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">Offline panchang, kundali,</text><text x="28" y="172" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">matching &amp; puja vidhi</text></g>
  <g class="in" style="animation-delay:.6s"><rect x="28" y="226" width="44" height="24" rx="12" fill="#f97316" fill-opacity=".18" stroke="#f97316" stroke-opacity=".6"/><text x="50.0" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">MAUI</text><rect x="80" y="226" width="65" height="24" rx="12" fill="#f97316" fill-opacity=".18" stroke="#f97316" stroke-opacity=".6"/><text x="112.5" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">Android</text><rect x="153" y="226" width="65" height="24" rx="12" fill="#f97316" fill-opacity=".18" stroke="#f97316" stroke-opacity=".6"/><text x="185.5" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">Windows</text></g>
</g>
<rect x="1" y="1" width="558" height="278" rx="17" fill="none" stroke="url(#bd)" stroke-width="2"/>
</svg>