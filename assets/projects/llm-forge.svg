<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="LLM Forge — Run &amp; fine-tune local LLMs on Android &amp; Windows, offline">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b3b"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f97316"><animate attributeName="stop-color" values="#f97316;#f43f5e;#f97316" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#f43f5e"><animate attributeName="stop-color" values="#f43f5e;#f97316;#f43f5e" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#f97316" stop-opacity=".45"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f43f5e" stop-opacity="0"/><stop offset="1" stop-color="#f43f5e" stop-opacity=".55"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="560" height="280" rx="18"/></clipPath>
  <style>
    .in   { animation: in .9s ease-out backwards; }
    @keyframes in { from { opacity:0; transform: translateY(10px); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity:.55; transform: scale(.9); } 50% { opacity:1; transform: scale(1.12); } }
    .spin { animation: spin 3s linear infinite; transform-origin: 462px 128px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip { animation: blip 2.7s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blip { 0% { opacity:0; transform: scale(.4); } 15% { opacity:1; transform: scale(1.4); } 100% { opacity:0; } }
    .ripple { animation: ripple 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ripple { from { transform: scale(1); opacity:.9; } to { transform: scale(4.2); opacity:0; } }
    .grow { animation: grow 2.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    @keyframes grow { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
    .draw { animation: draw 4s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 600; } 60%,100% { stroke-dashoffset: 0; } }
    .fan { animation: fan 3.2s ease-in-out infinite alternate; transform-origin: 462px 198px; }
    @keyframes fan { from { transform: rotate(0deg); } to { transform: rotate(var(--a)); } }
    .bob { animation: bob 2.2s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .float { animation: float 3.6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px); opacity:.7; } }
    .speed { animation: speed .9s linear infinite; }
    @keyframes speed { from { transform: translateY(-30px); opacity:0; } 50% { opacity:1; } to { transform: translateY(40px); opacity:0; } }
    .rise { animation: rise 2.8s ease-in infinite; }
    @keyframes rise { from { transform: translateY(0); opacity:0; } 20% { opacity:1; } to { transform: translateY(-140px); opacity:0; } }
    .hammer { animation: hammer 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; }
    @keyframes hammer { 0%,100% { transform: rotate(0); } 40% { transform: rotate(-35deg); } }
    .dust { animation: dust 2.6s ease-in infinite; }
    @keyframes dust { 0%,30% { transform: translate(0,0); opacity:1; } 100% { transform: translate(-60px,-50px) rotate(90deg); opacity:0; } }
    .brush { animation: brush 1.3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top; }
    @keyframes brush { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
    .type { animation: type 3.5s ease-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes type { 0% { transform: scaleX(0); } 25%,100% { transform: scaleX(1); } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(280px); } }
    .live { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity:.25; } }
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="560" height="280" fill="url(#bg)"/>
  <circle cx="462" cy="128" r="150" fill="url(#glow)"/>
  <g><path d="M402 148 h120 l-20 25 h-80 z" fill="#f97316" fill-opacity=".8"/><rect x="437" y="173" width="50" height="30" fill="#f97316" fill-opacity=".6"/><circle cx="462" cy="143" r="2.5" fill="#f43f5e"><animate attributeName="cx" values="462;401.4" dur="1.1s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="cy" values="143;108.0" dur="1.1s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="462" cy="143" r="2.5" fill="#fde047"><animate attributeName="cx" values="462;410.0" dur="1.1s" begin="0.11s" repeatCount="indefinite"/><animate attributeName="cy" values="143;96.2" dur="1.1s" begin="0.11s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.11s" repeatCount="indefinite"/></circle><circle cx="462" cy="143" r="2.5" fill="#f43f5e"><animate attributeName="cx" values="462;420.9" dur="1.1s" begin="0.22s" repeatCount="indefinite"/><animate attributeName="cy" values="143;86.4" dur="1.1s" begin="0.22s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.22s" repeatCount="indefinite"/></circle><circle cx="462" cy="143" r="2.5" fill="#fde047"><animate attributeName="cx" values="462;433.5" dur="1.1s" begin="0.33s" repeatCount="indefinite"/><animate attributeName="cy" values="143;79.1" dur="1.1s" begin="0.33s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.33s" repeatCount="indefinite"/></circle><circle cx="462" cy="143" r="2.5" fill="#f43f5e"><animate attributeName="cx" values="462;447.4" dur="1.1s" begin="0.44s" repeatCount="indefinite"/><animate attributeName="cy" values="143;74.5" dur="1.1s" begin="0.44s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.44s" repeatCount="indefinite"/></circle><circle cx="462" cy="143" r="2.5" fill="#fde047"><animate attributeName="cx" values="462;462.0" dur="1.1s" begin="0.55s" repeatCount="indefinite"/><animate attributeName="cy" values="143;73.0" dur="1.1s" begin="0.55s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.55s" repeatCount="indefinite"/></circle><circle cx="462" cy="143" r="2.5" fill="#f43f5e"><animate attributeName="cx" values="462;476.6" dur="1.1s" begin="0.66s" repeatCount="indefinite"/><animate attributeName="cy" values="143;74.5" dur="1.1s" begin="0.66s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.66s" repeatCount="indefinite"/></circle><circle cx="462" cy="143" r="2.5" fill="#fde047"><animate attributeName="cx" values="462;490.5" dur="1.1s" begin="0.77s" repeatCount="indefinite"/><animate attributeName="cy" values="143;79.1" dur="1.1s" begin="0.77s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.77s" repeatCount="indefinite"/></circle><circle cx="462" cy="143" r="2.5" fill="#f43f5e"><animate attributeName="cx" values="462;503.1" dur="1.1s" begin="0.88s" repeatCount="indefinite"/><animate attributeName="cy" values="143;86.4" dur="1.1s" begin="0.88s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.88s" repeatCount="indefinite"/></circle><circle cx="462" cy="143" r="2.5" fill="#fde047"><animate attributeName="cx" values="462;514.0" dur="1.1s" begin="0.99s" repeatCount="indefinite"/><animate attributeName="cy" values="143;96.2" dur="1.1s" begin="0.99s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.99s" repeatCount="indefinite"/></circle><text x="470" y="123" font-size="30" class="hammer">🔨</text></g>
  <rect class="scan" x="0" y="0" width="560" height="80" fill="url(#scan)"/>
  <g class="in">
    <rect x="28" y="28" width="136" height="22" rx="11" fill="#f97316" fill-opacity=".18" stroke="#f97316" stroke-opacity=".7"/>
    <circle cx="40" cy="39" r="4" fill="#f97316" class="live"/>
    <text x="50" y="43" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="700" fill="#f97316" letter-spacing=".5">IN DEVELOPMENT</text>
  </g>
  <g class="in" style="animation-delay:.2s">
    <text x="28" y="105" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff">⚒️ LLM Forge</text>
  </g>
  <g class="in" style="animation-delay:.4s"><text x="28" y="150" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">Run &amp; fine-tune local LLMs</text><text x="28" y="172" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">on Android &amp; Windows, offline</text></g>
  <g class="in" style="animation-delay:.6s"><rect x="28" y="226" width="44" height="24" rx="12" fill="#f97316" fill-opacity=".18" stroke="#f97316" stroke-opacity=".6"/><text x="50.0" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">MAUI</text><rect x="80" y="226" width="65" height="24" rx="12" fill="#f97316" fill-opacity=".18" stroke="#f97316" stroke-opacity=".6"/><text x="112.5" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">Android</text><rect x="153" y="226" width="65" height="24" rx="12" fill="#f97316" fill-opacity=".18" stroke="#f97316" stroke-opacity=".6"/><text x="185.5" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">Windows</text></g>
</g>
<rect x="1" y="1" width="558" height="278" rx="17" fill="none" stroke="url(#bd)" stroke-width="2"/>
</svg>