<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="Design Studio 3D — Interior &amp; exterior 3D design with an on-device AI assistant">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b3b"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ec4899"><animate attributeName="stop-color" values="#ec4899;#8b5cf6;#ec4899" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#ec4899;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#ec4899" stop-opacity=".45"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".55"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="560" height="280" rx="18"/></clipPath>
  <style>
    .in   { animation: in .9s ease-out backwards; }
    @keyframes in { from { opacity:0; transform: translateY(10px); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity:.55; transform: scale(.9); } 50% { opacity:1; transform: scale(1.12); } }
    .spin { animation: spin 3s linear infinite; transform-origin: 462px 128px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip { animation: blip 2.7s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blip { 0% { opacity:0; transform: scale(.4); } 15% { opacity:1; transform: scale(1.4); } 100% { opacity:0; } }
    .ripple { animation: ripple 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ripple { from { transform: scale(1); opacity:.9; } to { transform: scale(4.2); opacity:0; } }
    .grow { animation: grow 2.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    @keyframes grow { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
    .draw { animation: draw 4s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 600; } 60%,100% { stroke-dashoffset: 0; } }
    .fan { animation: fan 3.2s ease-in-out infinite alternate; transform-origin: 462px 198px; }
    @keyframes fan { from { transform: rotate(0deg); } to { transform: rotate(var(--a)); } }
    .bob { animation: bob 2.2s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .float { animation: float 3.6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px); opacity:.7; } }
    .speed { animation: speed .9s linear infinite; }
    @keyframes speed { from { transform: translateY(-30px); opacity:0; } 50% { opacity:1; } to { transform: translateY(40px); opacity:0; } }
    .rise { animation: rise 2.8s ease-in infinite; }
    @keyframes rise { from { transform: translateY(0); opacity:0; } 20% { opacity:1; } to { transform: translateY(-140px); opacity:0; } }
    .hammer { animation: hammer 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; }
    @keyframes hammer { 0%,100% { transform: rotate(0); } 40% { transform: rotate(-35deg); } }
    .dust { animation: dust 2.6s ease-in infinite; }
    @keyframes dust { 0%,30% { transform: translate(0,0); opacity:1; } 100% { transform: translate(-60px,-50px) rotate(90deg); opacity:0; } }
    .brush { animation: brush 1.3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top; }
    @keyframes brush { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
    .type { animation: type 3.5s ease-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes type { 0% { transform: scaleX(0); } 25%,100% { transform: scaleX(1); } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(280px); } }
    .live { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity:.25; } }
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="560" height="280" fill="url(#bg)"/>
  <circle cx="462" cy="128" r="150" fill="url(#glow)"/>
  <g><g class="bob"><path d="M462 78 L512 103.0 L462 128 L412 103.0 Z" fill="#8b5cf6" fill-opacity=".9"/><path d="M412 103.0 L462 128 L462 178 L412 153.0 Z" fill="#ec4899" fill-opacity=".85"/><path d="M512 103.0 L462 128 L462 178 L512 153.0 Z" fill="#ec4899" fill-opacity=".55"/><path d="M462 78 L512 103.0 L462 128 L412 103.0 Z M412 103.0 L462 128 L462 178 L412 153.0 Z M512 103.0 L462 128 L462 178 L512 153.0 Z" fill="none" stroke="#fff" stroke-opacity=".35"/></g><text x="377" y="73" font-size="22" class="float" style="animation-delay:0.0s">🛋️</text><text x="532" y="68" font-size="22" class="float" style="animation-delay:0.7s">🪴</text><text x="537" y="183" font-size="22" class="float" style="animation-delay:1.4s">💡</text></g>
  <rect class="scan" x="0" y="0" width="560" height="80" fill="url(#scan)"/>
  <g class="in">
    <rect x="28" y="28" width="136" height="22" rx="11" fill="#ec4899" fill-opacity=".18" stroke="#ec4899" stroke-opacity=".7"/>
    <circle cx="40" cy="39" r="4" fill="#ec4899" class="live"/>
    <text x="50" y="43" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="700" fill="#ec4899" letter-spacing=".5">IN DEVELOPMENT</text>
  </g>
  <g class="in" style="animation-delay:.2s">
    <text x="28" y="105" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff">🏠 Design Studio 3D</text>
  </g>
  <g class="in" style="animation-delay:.4s"><text x="28" y="150" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">Interior &amp; exterior 3D design</text><text x="28" y="172" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">with an on-device AI assistant</text></g>
  <g class="in" style="animation-delay:.6s"><rect x="28" y="226" width="44" height="24" rx="12" fill="#ec4899" fill-opacity=".18" stroke="#ec4899" stroke-opacity=".6"/><text x="50.0" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">MAUI</text><rect x="80" y="226" width="30" height="24" rx="12" fill="#ec4899" fill-opacity=".18" stroke="#ec4899" stroke-opacity=".6"/><text x="95.0" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">3D</text><rect x="118" y="226" width="79" height="24" rx="12" fill="#ec4899" fill-opacity=".18" stroke="#ec4899" stroke-opacity=".6"/><text x="157.5" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">Local LLM</text></g>
</g>
<rect x="1" y="1" width="558" height="278" rx="17" fill="none" stroke="url(#bd)" stroke-width="2"/>
</svg>