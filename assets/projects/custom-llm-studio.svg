<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="Custom LLM Studio — Train models from scratch, build scope-locked agents &amp; bots">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b3b"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#f472b6;#a855f7" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#a855f7;#f472b6" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#a855f7" stop-opacity=".45"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset="1" stop-color="#f472b6" stop-opacity=".55"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="560" height="280" rx="18"/></clipPath>
  <style>
    .in   { animation: in .9s ease-out backwards; }
    @keyframes in { from { opacity:0; transform: translateY(10px); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity:.55; transform: scale(.9); } 50% { opacity:1; transform: scale(1.12); } }
    .spin { animation: spin 3s linear infinite; transform-origin: 462px 128px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip { animation: blip 2.7s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blip { 0% { opacity:0; transform: scale(.4); } 15% { opacity:1; transform: scale(1.4); } 100% { opacity:0; } }
    .ripple { animation: ripple 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ripple { from { transform: scale(1); opacity:.9; } to { transform: scale(4.2); opacity:0; } }
    .grow { animation: grow 2.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    @keyframes grow { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
    .draw { animation: draw 4s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 600; } 60%,100% { stroke-dashoffset: 0; } }
    .fan { animation: fan 3.2s ease-in-out infinite alternate; transform-origin: 462px 198px; }
    @keyframes fan { from { transform: rotate(0deg); } to { transform: rotate(var(--a)); } }
    .bob { animation: bob 2.2s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .float { animation: float 3.6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px); opacity:.7; } }
    .speed { animation: speed .9s linear infinite; }
    @keyframes speed { from { transform: translateY(-30px); opacity:0; } 50% { opacity:1; } to { transform: translateY(40px); opacity:0; } }
    .rise { animation: rise 2.8s ease-in infinite; }
    @keyframes rise { from { transform: translateY(0); opacity:0; } 20% { opacity:1; } to { transform: translateY(-140px); opacity:0; } }
    .hammer { animation: hammer 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; }
    @keyframes hammer { 0%,100% { transform: rotate(0); } 40% { transform: rotate(-35deg); } }
    .dust { animation: dust 2.6s ease-in infinite; }
    @keyframes dust { 0%,30% { transform: translate(0,0); opacity:1; } 100% { transform: translate(-60px,-50px) rotate(90deg); opacity:0; } }
    .brush { animation: brush 1.3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top; }
    @keyframes brush { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
    .type { animation: type 3.5s ease-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes type { 0% { transform: scaleX(0); } 25%,100% { transform: scaleX(1); } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(280px); } }
    .live { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity:.25; } }
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="560" height="280" fill="url(#bg)"/>
  <circle cx="462" cy="128" r="150" fill="url(#glow)"/>
  <g><line x1="402" y1="83" x2="462" y2="68" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line><line x1="402" y1="83" x2="462" y2="108" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/></line><line x1="402" y1="83" x2="462" y2="148" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.7999999999999998s" repeatCount="indefinite"/></line><line x1="402" y1="83" x2="462" y2="188" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.0999999999999996s" repeatCount="indefinite"/></line><line x1="402" y1="128" x2="462" y2="68" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line><line x1="402" y1="128" x2="462" y2="108" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/></line><line x1="402" y1="128" x2="462" y2="148" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.7999999999999998s" repeatCount="indefinite"/></line><line x1="402" y1="128" x2="462" y2="188" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.0999999999999996s" repeatCount="indefinite"/></line><line x1="402" y1="173" x2="462" y2="68" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line><line x1="402" y1="173" x2="462" y2="108" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/></line><line x1="402" y1="173" x2="462" y2="148" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.7999999999999998s" repeatCount="indefinite"/></line><line x1="402" y1="173" x2="462" y2="188" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.0999999999999996s" repeatCount="indefinite"/></line><line x1="462" y1="68" x2="522" y2="98" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line><line x1="462" y1="68" x2="522" y2="158" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/></line><line x1="462" y1="108" x2="522" y2="98" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.7999999999999998s" repeatCount="indefinite"/></line><line x1="462" y1="108" x2="522" y2="158" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.0999999999999996s" repeatCount="indefinite"/></line><line x1="462" y1="148" x2="522" y2="98" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line><line x1="462" y1="148" x2="522" y2="158" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/></line><line x1="462" y1="188" x2="522" y2="98" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.7999999999999998s" repeatCount="indefinite"/></line><line x1="462" y1="188" x2="522" y2="158" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.0999999999999996s" repeatCount="indefinite"/></line><circle cx="402" cy="83" r="7" fill="#a855f7" class="pulse" style="animation-delay:0.00s"/><circle cx="402" cy="128" r="7" fill="#a855f7" class="pulse" style="animation-delay:0.25s"/><circle cx="402" cy="173" r="7" fill="#a855f7" class="pulse" style="animation-delay:0.50s"/><circle cx="462" cy="68" r="7" fill="#a855f7" class="pulse" style="animation-delay:0.75s"/><circle cx="462" cy="108" r="7" fill="#a855f7" class="pulse" style="animation-delay:1.00s"/><circle cx="462" cy="148" r="7" fill="#a855f7" class="pulse" style="animation-delay:1.25s"/><circle cx="462" cy="188" r="7" fill="#a855f7" class="pulse" style="animation-delay:1.50s"/><circle cx="522" cy="98" r="7" fill="#a855f7" class="pulse" style="animation-delay:1.75s"/><circle cx="522" cy="158" r="7" fill="#a855f7" class="pulse" style="animation-delay:2.00s"/></g>
  <rect class="scan" x="0" y="0" width="560" height="80" fill="url(#scan)"/>
  <g class="in">
    <rect x="28" y="28" width="136" height="22" rx="11" fill="#a855f7" fill-opacity=".18" stroke="#a855f7" stroke-opacity=".7"/>
    <circle cx="40" cy="39" r="4" fill="#a855f7" class="live"/>
    <text x="50" y="43" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="700" fill="#a855f7" letter-spacing=".5">IN DEVELOPMENT</text>
  </g>
  <g class="in" style="animation-delay:.2s">
    <text x="28" y="105" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff">🧠 Custom LLM Studio</text>
  </g>
  <g class="in" style="animation-delay:.4s"><text x="28" y="150" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">Train models from scratch, build</text><text x="28" y="172" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#cbd5e1">scope-locked agents &amp; bots</text></g>
  <g class="in" style="animation-delay:.6s"><rect x="28" y="226" width="44" height="24" rx="12" fill="#a855f7" fill-opacity=".18" stroke="#a855f7" stroke-opacity=".6"/><text x="50.0" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">.NET</text><rect x="80" y="226" width="100" height="24" rx="12" fill="#a855f7" fill-opacity=".18" stroke="#a855f7" stroke-opacity=".6"/><text x="130.0" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">LLM Training</text><rect x="188" y="226" width="58" height="24" rx="12" fill="#a855f7" fill-opacity=".18" stroke="#a855f7" stroke-opacity=".6"/><text x="217.0" y="242" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#e2e8f0">Agents</text></g>
</g>
<rect x="1" y="1" width="558" height="278" rx="17" fill="none" stroke="url(#bd)" stroke-width="2"/>
</svg>